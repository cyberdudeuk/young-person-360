description:
  en-GB:
    shortDescription: Children and young people held, lost or unseen by the system, across the UK, each figure sourced. Prototype.
    longDescription: >-
      A single page mapping every child and young person the state holds, loses or never sees, from birth to 25: the
      cohorts and how many there are, the records kept about them, where the trail breaks, the departure events where
      oversight ends, history, the four nations and the options. It checks itself in the browser. Independent work;
      not an official government service.
    features: [Cohort map, Record trail, Departure events, Four nations, Self-checking page]
